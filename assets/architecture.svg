<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Numeria Arena architecture</title>
  <desc id="desc">One Rust core computes every answer and every fairness decision. It runs as WebAssembly in the headset game, natively in the game server, and natively in the content tool that validates item templates. The headset plays practice and robot races offline; the server adds teacher classes, class races on its own clock, sync and the class screen. AI providers are an optional layer behind the server.</desc>

  <defs>
    <style>
      .b   { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 11.5px; fill: #2e3448; }
      .h   { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 14.5px; font-weight: 650; fill: #1f2a44; }
      .s   { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 10px; fill: #6b6a74; }
      .lbl { font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 10.5px; fill: #474b5c; }
      .lblk{ font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 10.5px; font-weight: 650; fill: #b24a33; }
      .m   { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; fill: #1f2a44; }
      .on-dark      { fill: #ffffff; }
      .on-dark-soft { fill: #f3d9cf; }
      .box  { fill: #ffffff; stroke: #dccfb8; stroke-width: 1.2; }
      .plan { fill: #ffffff; stroke: #dccfb8; stroke-width: 1.2; }
      .arr  { stroke: #8a8577; stroke-width: 1.4; fill: none; }
      .arrp { stroke: #8a8577; stroke-width: 1.4; fill: none; }
      .arrk { stroke: #c8553d; stroke-width: 2.4; fill: none; stroke-dasharray: 2 5; stroke-linecap: round; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8577"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#f7f3ea"/>

  <!-- ============ left: player devices ============ -->
  <text class="s" x="24" y="30">Player devices, in the browser. No install, no student login.</text>

  <!-- headset -->
  <rect class="box" x="24" y="42" width="286" height="196" rx="10"/>
  <text class="h" x="40" y="68">Headset game</text>
  <text class="m" x="40" y="86">codes/xrclient  /play</text>
  <text class="b" x="40" y="108">Immersive Web SDK on a Meta Quest</text>
  <text class="b" x="40" y="126">Hands first: poke, pinch, grab</text>
  <text class="b" x="40" y="144">Book placed on the detected table</text>
  <text class="b" x="40" y="162">Practice and robot races, offline</text>
  <rect x="40" y="178" width="254" height="44" rx="7" fill="#1f2a44"/>
  <text class="h on-dark" x="54" y="198">core</text>
  <text class="s on-dark-soft" x="54" y="213">Rust compiled to WebAssembly</text>

  <!-- classroom pages -->
  <rect class="box" x="24" y="258" width="286" height="178" rx="10"/>
  <text class="h" x="40" y="284">Classroom pages</text>
  <text class="m" x="40" y="302">codes/frontrouter  /</text>
  <text class="b" x="40" y="324">React Router single page app</text>
  <text class="b" x="40" y="342">Teacher, class screen, smartboard</text>
  <text class="b" x="40" y="360">race, Math Lessons, admin</text>
  <rect class="box" x="40" y="376" width="254" height="44" rx="7"/>
  <text class="h" x="54" y="396">Adults sign in</text>
  <text class="s" x="54" y="411">Firebase: Google, Facebook or email</text>

  <!-- ============ middle: our server ============ -->
  <rect x="352" y="42" width="300" height="394" rx="10" fill="#efe7d6" stroke="#c9b99c" stroke-width="1.2"/>
  <text class="s" x="364" y="60">Our server, one domain over HTTPS</text>

  <rect class="plan" x="372" y="74" width="260" height="176" rx="10"/>
  <text class="h" x="388" y="100">Game server</text>
  <text class="m" x="388" y="118">codes/backrust/server  /api  /ws</text>
  <text class="b" x="388" y="140">Rooms, play and watch codes</text>
  <text class="b" x="388" y="158">Class races on the server's clock</text>
  <text class="b" x="388" y="176">Classes, reports, town sync, bots</text>
  <rect x="388" y="192" width="228" height="44" rx="7" fill="#1f2a44"/>
  <text class="h on-dark" x="402" y="212">core</text>
  <text class="s on-dark-soft" x="402" y="227">the same Rust code, native</text>

  <rect class="plan" x="372" y="272" width="260" height="68" rx="10"/>
  <text class="h" x="388" y="298">PostgreSQL</text>
  <text class="b" x="388" y="318">Pseudonymous seats, answer events</text>

  <rect class="plan" x="372" y="354" width="260" height="68" rx="10"/>
  <text class="h" x="388" y="380">AI gateway</text>
  <text class="b" x="388" y="400">Structured data in, checked text out</text>

  <!-- ============ right: outside services ============ -->
  <text class="s" x="694" y="30">Optional. The game runs fully without it.</text>
  <rect class="plan" x="694" y="354" width="242" height="68" rx="10"/>
  <text class="h" x="710" y="380">AI providers</text>
  <text class="b" x="710" y="400">OpenAI-compatible, Amazon Bedrock</text>

  <rect class="box" x="694" y="42" width="242" height="150" rx="10"/>
  <text class="h" x="710" y="68">What never leaves</text>
  <text class="h" x="710" y="86">the device</text>
  <text class="b" x="710" y="110">Camera and passthrough images</text>
  <text class="b" x="710" y="128">Room planes and meshes</text>
  <text class="b" x="710" y="146">Raw hand positions, voice</text>
  <text class="b" x="710" y="164">Real names of students</text>

  <!-- arrows: devices to server -->
  <path class="arrp" marker-end="url(#a)" d="M 310 120 L 372 120"/>
  <text class="lbl" x="316" y="112">actions</text>
  <path class="arrp" marker-end="url(#a)" d="M 310 330 C 340 330 340 170 372 170"/>
  <text class="lbl" x="316" y="350">taps</text>
  <path class="arrp" marker-end="url(#a)" d="M 502 250 L 502 272"/>
  <path class="arrp" marker-end="url(#a)" d="M 632 388 L 694 388"/>
  <path class="arrp" marker-end="url(#a)" d="M 610 250 C 650 290 650 340 610 354"/>

  <!-- ============ bottom: content pipeline ============ -->
  <text class="s" x="24" y="470">Content tooling, offline. Not part of the running game.</text>

  <rect class="box" x="24" y="482" width="286" height="130" rx="10"/>
  <text class="h" x="40" y="508">Item templates</text>
  <text class="m" x="40" y="526">codes/content</text>
  <text class="b" x="40" y="548">28 skills for grades 4 to 6</text>
  <text class="b" x="40" y="566">206 templates, JSON Schema</text>
  <text class="b" x="40" y="584">Answers written as expressions,</text>
  <text class="b" x="40" y="600">never as numbers</text>

  <rect class="box" x="352" y="482" width="300" height="130" rx="10"/>
  <text class="h" x="368" y="508">content-cli</text>
  <text class="m" x="368" y="526">codes/backrust/content-cli</text>
  <text class="b" x="368" y="548">validate: schema, 2000 draws per template</text>
  <text class="b" x="368" y="566">instantiate: one concrete item</text>
  <rect x="368" y="578" width="268" height="26" rx="6" fill="#1f2a44"/>
  <text class="b on-dark" x="380" y="595">core, native: same answers as the game</text>

  <rect class="box" x="694" y="482" width="242" height="130" rx="10"/>
  <text class="h" x="710" y="508">Fairness simulator</text>
  <text class="m" x="710" y="526">content-cli simulate</text>
  <text class="b" x="710" y="548">Synthetic students of known</text>
  <text class="b" x="710" y="566">ability play the real engine</text>
  <text class="b" x="710" y="584">Pass or fail per rule, with</text>
  <text class="b" x="710" y="600">what it does not check</text>

  <path class="arr" marker-end="url(#a)" d="M 310 548 L 352 548"/>
  <path class="arr" marker-end="url(#a)" d="M 652 548 L 694 548"/>

  <!-- the one core -->
  <path class="arrk" d="M 294 200 L 362 200"/>
  <path class="arrk" d="M 362 200 L 362 591 L 368 591"/>
  <path class="arrk" d="M 362 214 L 388 214"/>
  <text class="lblk" x="374" y="458">one core, three places:</text>
  <text class="lblk" x="374" y="472">the answer is always computed by the same code</text>

  <!-- legend -->
  <rect class="box" x="694" y="212" width="242" height="42" rx="10"/>
  <rect x="710" y="226" width="26" height="14" rx="3" fill="#ffffff" stroke="#dccfb8" stroke-width="1.2"/>
  <text class="lbl" x="744" y="237">built</text>
  <rect x="800" y="226" width="26" height="14" rx="3" fill="#1f2a44"/>
  <text class="lbl" x="834" y="237">shared core</text>
</svg>
