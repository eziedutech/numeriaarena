server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # The game is several megabytes of code: send the .gz made at build time,
    # and compress anything else that compresses on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml text/plain;

    location = /play {
        return 301 /play/;
    }
    location = /play/version.json {
        add_header Cache-Control "no-store";
    }
    # The offline worker lists the build's files: always checked, so a new build is seen.
    location = /play/sw.js {
        add_header Cache-Control "no-cache";
    }
    # File names carry a content hash: keep them for a year.
    location /play/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /play/ {
        try_files $uri $uri/ /play/index.html;
    }
}
