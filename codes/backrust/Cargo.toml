[workspace]
resolver = "3"
members = ["core", "content-cli", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
wasm-bindgen = "=0.2.129"
sha2 = "=0.11.0"
jsonschema = { version = "=0.58.2", default-features = false }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "derive", "json"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
